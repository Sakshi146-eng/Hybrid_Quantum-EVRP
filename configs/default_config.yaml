# Default Configuration for Quantum-Assisted EVRP Pipeline

project:
  name: "quantum-evrp"
  seed: 42
  environment: "development"

# VRP Data Settings
vrp:
  num_nodes: 4
  num_vehicles: 1
  depot_index: 0
  distance_metric: "euclidean"

# QUBO Formulation Settings
qubo:
  # Penalty weights (To be determined based on mathematical formulation & paper)
  penalty_one_visit: 10.0      # TODO: Verify penalty formulation from base paper
  penalty_subtour: 10.0        # TODO: Verify subtour elimination method
  penalty_capacity: 10.0       # TODO: Verify capacity penalty encoding

# QAOA Settings
qaoa:
  p_steps: 1                   # Number of QAOA layers (p)
  backend: "qasm_simulator"    # Quantum backend ("aer_simulator", "qasm_simulator", etc.)
  shots: 1024
  # Default initial gamma and beta parameters
  initial_gamma: 0.5
  initial_beta: 0.5

# RL Settings (For QAOA Parameter Optimization)
rl:
  algorithm: "TODO_DETERMINE"  # e.g., PPO, DDPG, SAC - TODO: Verify exact algorithm from base paper
  learning_rate: 0.001
  max_episodes: 100
  gamma_discount: 0.99
  state_space_dim: "TODO"      # TODO: Verify state representation from base paper
  action_space_dim: "TODO"     # TODO: Verify action representation (e.g. delta gamma, delta beta)

# EVRP Settings (Phase 2 Extension)
evrp:
  battery_capacity: 100.0      # Maximum battery level
  energy_consumption_rate: 1.0 # Energy consumed per unit distance
  num_charging_stations: 1
  charging_rate: 10.0          # Charging speed
  vehicle_capacity: 50.0       # EV payload capacity
